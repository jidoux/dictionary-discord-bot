# On the actual machine, the volume (which contains some logs that I want for observability reasons) is at /var/lib/docker/volumes/Logs
name: Put code on server and restart bot over there

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and Deploy
      shell: bash
      env:
        DISCORD__TOKEN: ${{ secrets.DISCORD__TOKEN }}
        CONNECTIONSTRINGS__DEFAULTCONNECTION: ${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}
        SERILOG__MINIMUMLEVEL__DEFAULT: ${{ secrets.SERILOG__MINIMUMLEVEL__DEFAULT }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        docker build . --file Dockerfile --tag word-of-the-day-robot

        # Write the private key from secrets to a temp file
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

        # Pipe image directly to server over SSH
        docker save word-of-the-day-robot | gzip | ssh -i ~/.ssh/deploy_key opc@"$SERVER_IP" "gunzip | docker load"

        ssh -i ~/.ssh/deploy_key opc@"$SERVER_IP" << ENDSSH
          docker stop word-of-the-day-robot 2>/dev/null || true
          docker rm word-of-the-day-robot 2>/dev/null || true
          docker run -d \
            --name word-of-the-day-robot \
            --restart unless-stopped \
            -e DISCORD__TOKEN="$DISCORD__TOKEN" \
            -e CONNECTIONSTRINGS__DEFAULTCONNECTION="$CONNECTIONSTRINGS__DEFAULTCONNECTION" \
            -e SERILOG__MINIMUMLEVEL__DEFAULT="$SERILOG__MINIMUMLEVEL__DEFAULT" \
            -p 5432:5432 \
            -v Logs:/app/Logs \
            word-of-the-day-robot
        ENDSSH
